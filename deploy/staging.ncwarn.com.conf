# NC Risk Radar — staging vhost. Upstream: docker web container on 127.0.0.1:3020.
# Install: cp deploy/staging.ncwarn.com.conf /etc/nginx/sites-available/ && ln -s ../sites-available/staging.ncwarn.com.conf /etc/nginx/sites-enabled/
# Then: certbot --nginx -d staging.ncwarn.com   (adds the 443 block + redirect)
# Cloudflare real IP (record is DNS-only today; harmless if proxied later):
# set_real_ip_from ranges live in /etc/nginx/conf.d/cloudflare-real-ip.conf when the record is proxied.

upstream ncriskradar_web { server 127.0.0.1:3020; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name staging.ncwarn.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Staging: keep search engines out (app also sends noindex).
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /_next/static/ {
        proxy_pass http://ncriskradar_web;
        proxy_http_version 1.1; proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /api/health { proxy_pass http://ncriskradar_web; proxy_http_version 1.1; proxy_set_header Connection ""; access_log off; }
    location / {
        proxy_pass http://ncriskradar_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s; proxy_send_timeout 30s; proxy_read_timeout 30s;
    }
}
